apiVersion: 1
providers:
  - name: "WISDM Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      # Change this to the directory Grafana can read from (e.g. /var/lib/grafana/dashboards)
      path: /var/lib/grafana/dashboards/wisdmdashboards

