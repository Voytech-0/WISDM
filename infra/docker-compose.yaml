services:

  app:

    build:
      context: ..
      dockerfile: infra/build/Dockerfile
    image: wisdm:latest
    command: python src/main.py
    env_file:
      - ../.env

    depends_on:
      mlflow:
        condition: service_healthy
      db_init:
        condition: service_started # here we do not wait for full population of mysql.

    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 30
      start_period: 10s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.0rc0
    command: mlflow server --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
  db_init:
    build:
      context: ..
      dockerfile: infra/db_init/Dockerfile
    image: wisdm-db-init:latest
    env_file:
      - ../.env
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
