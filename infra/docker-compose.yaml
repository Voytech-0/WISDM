services:

  app:
    image: wisdm:latest
    command: python src/main_api.py serve
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ZENML_STORE_URL=http://zenml:8080
      - ZENML_STORE_USERNAME=admin
      - ZENML_STORE_PASSWORD=zenml
    depends_on:
      db-init:
        condition: service_started
      zenml:
        condition: service_started
    volumes:
      - ./zenml_artifacts:/root/.config/zenml
      - zenml_artifact_store:/mnt/zenml_artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 30
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - prometheus_push_gateway
    volumes:
      - "./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./telemetry/alerts.yml:/etc/prometheus/alerts.yml"
    ports:
      - "9090:9090"
    healthcheck:
      test: wget http://localhost:9090/metrics -S -O - || exit 1
      retries: 3
      interval: 5s

  prometheus_push_gateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "9091:9091"
    healthcheck:
      test: wget http://localhost:9091/metrics -S -O - || exit 1
      retries: 3
      interval: 5s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --local-infile=1
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_HOST=%
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  db-init:
    build:
      context: ..
      dockerfile: infra/db_init/Dockerfile
    image: db-init:latest
    command: flask --app db_init/populate_db run --host 0.0.0.0 --port 5001
    env_file:
      - ../.env
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy


  grafana:
    image: grafana/grafana:9.5.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    volumes:
      - "./telemetry/provisioning/:/etc/grafana/provisioning/"
      - "./telemetry/dashboards/:/var/lib/grafana/dashboards/"
    depends_on:
      prometheus:
        condition: service_healthy
      prometheus_push_gateway:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 10s
      retries: 5

  zenml:
    image: "zenmldocker/zenml-server:latest"
    environment:
      - ZENML_SERVER_DB_URL=sqlite:////data/zenml-server.db
      - ZENML_DEFAULT_USER_NAME=admin
      - ZENML_DEFAULT_USER_PASSWORD=zenml
      - ZENML_SERVER_AUTO_ACTIVATE=1
    ports:
      - "8081:8080"
    volumes:
      - zenml_server_data:/data
      - zenml_artifact_store:/mnt/zenml_artifacts
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8081/api/v1/health || exit 1
      interval: 10s
      retries: 5

volumes:
  mysql_data:
  zenml_server_data:
  zenml_artifact_store:
